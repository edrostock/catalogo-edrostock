<!DOCTYPE html>
<html lang="es-AR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Consulta especificaciones y precio del producto en EdroStock, Charata.">
  <meta name="robots" content="index, follow">
  
  <!-- Meta Etiquetas Dinámicas Open Graph -->
  <meta property="og:title" id="og-title" content="Detalle de Producto | EdroStock">
  <meta property="og:description" id="og-desc" content="Consulta especificaciones y precio del producto en Charata, Chaco.">
  <meta property="og:type" content="product">
  <meta property="og:image" id="og-image" content="assets/logo.png">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="twitter-title" content="Detalle de Producto | EdroStock">
  <meta name="twitter:description" id="twitter-desc" content="Consulta especificaciones y precio del producto.">
  <meta name="twitter:image" id="twitter-image" content="assets/logo.png">

  <title id="page-title">Cargando producto... | EdroStock</title>

  <!-- Favicon y PWA Manifest -->
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <!-- Tipografía Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Hojas de Estilo -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Schema.org JSON-LD (Inyectado por product-detail.js) -->
  <script type="application/ld+json" id="schema-jsonld"></script>
</head>
<body>

  <!-- ====================================================================
       1. ENCABEZADO Y MODO OSCURO
       ==================================================================== -->
  <header class="header">
    <div class="container header__content">
      <a href="index.html" class="header__brand" id="store-brand">
        <img src="assets/logo.png" alt="EdroStock Logo" class="header__logo" id="store-logo-img">
        <span id="store-name-display">EdroStock</span>
      </a>

      <div class="header__actions">
        <a href="index.html" class="btn btn--primary" style="padding: 0.5rem 1rem;">
          &larr; Volver al Catálogo
        </a>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Alternar modo oscuro">
          <span id="theme-icon">🌙</span>
        </button>
        <button id="header-cart-btn" class="header-cart-btn" aria-label="Ver carrito">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="22" height="22">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          <span id="cart-badge" class="cart-badge hidden">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ====================================================================
       2. CONTENEDOR PRINCIPAL DEL DETALLE DEL PRODUCTO
       ==================================================================== -->
  <main class="container" style="padding-top: 2rem; padding-bottom: 4rem;">
    <!-- Breadcrumb de Navegación -->
    <nav class="breadcrumb" id="breadcrumb" aria-label="Migas de pan" style="margin-bottom: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
      <!-- Inyectado dinámicamente -->
    </nav>

    <!-- Ficha del Producto o Skeleton Loading -->
    <div id="product-detail-wrapper">
      <!-- Inyectado por product-detail.js -->
    </div>

    <!-- Sección de Productos Relacionados -->
    <section id="related-section" class="hidden" style="margin-top: 4rem; border-top: 1px solid var(--border-color); padding-top: 2rem;">
      <h3 style="font-size: 1.35rem; font-weight: 700; margin-bottom: 1.5rem;">Productos Relacionados</h3>
      <div id="related-products-grid" class="products-grid">
        <!-- Renderizado por UI -->
      </div>
    </section>
  </main>

  <!-- Floating actions (solo whatsapp y subir) -->
  <div class="floating-actions">
    <a href="https://wa.me/tu-numero" class="whatsapp-float" aria-label="Contactar por WhatsApp" target="_blank" rel="noopener noreferrer">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
      </svg>
    </a>
    <button id="back-to-top" class="back-to-top hidden" aria-label="Volver arriba">
      &#8679;
    </button>
  </div>

  <!-- Carrito Modal -->
  <div id="cart-modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal__content modal__content--cart">
      <div class="cart-header">
        <h2 style="margin: 0; font-size: 1.25rem;">Tu Carrito</h2>
        <button id="cart-modal-close" class="modal__close" aria-label="Cerrar carrito">&times;</button>
      </div>
      <div id="cart-items" class="cart-items"></div>
      <div class="cart-footer">
        <div class="cart-total">
          <span>Total:</span>
          <span id="cart-total-price">$0.00</span>
        </div>
        <button id="cart-checkout-btn" class="btn btn--whatsapp" style="width: 100%; margin-top: 1rem;">
          Enviar pedido por WhatsApp
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">¡Enlace copiado al portapapeles!</div>

  <!-- Pie de Página -->
  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="current-year"></span> <span id="footer-store-name">EdroStock</span>. Charata, Chaco, Argentina. Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- Scripts Modulares -->
  <script src="js/config.js"></script>
  <script src="js/api.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/product-detail.js" defer></script>
</body>
</html>
